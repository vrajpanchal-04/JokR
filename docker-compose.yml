name: jokr

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      JOKR_APP_PASSWORD: ${JOKR_APP_PASSWORD:?set in .env}
      JOKR_SCOUT_PASSWORD: ${JOKR_SCOUT_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # localhost only; never expose the DB publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations as the table owner, then exits. Idempotent (A8).
  migrate:
    build:
      context: .
      target: base
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set in .env}
    depends_on:
      db:
        condition: service_healthy

  # Runs as the restricted jokr_app role only; it never sees owner credentials.
  api:
    build:
      context: .
      target: base
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      JOKR_CONFIG_DIR: /app/config
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
