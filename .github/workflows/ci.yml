name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: jokr
          POSTGRES_PASSWORD: jokr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jokr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jokr:jokr@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the history
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests (parallel, with coverage floor)
        # Connector tests replay scrubbed fixtures; nothing here calls the internet.
        run: uv run pytest -n auto --cov=jokr --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uv run pip-audit -r requirements.txt --disable-pip
      - name: Shellcheck hook and ops scripts
        run: uv run pre-commit run shellcheck --all-files
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    # A1/A2: the real stack comes up healthy from zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl -fsS localhost:8000/health
      # Scout's wiring without the internet: its role logs in, sources are synced.
      - run: docker compose --profile jobs run --rm scout jokr scout stats
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
