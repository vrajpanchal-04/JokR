# Test override: `make test` runs the suite in a separate compose project
# with a throwaway, in-memory database. It never touches the dev volume.
# The Makefile sets throwaway POSTGRES_* values, so no .env is needed and the
# dev credentials are never used.
services:
  db:
    volumes: !override
      - ./ops/db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports: !reset []

  api:
    profiles: ["never"]

  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://jokr:jokr-test@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
